name: Build Modern Expo APK
on:
  # دا برخه اکشن په اتومات ډول رن کوي کله چې کوډ main برانچ ته push شي
  push:
    branches: [ main ]
  # دا برخه تاسو ته اجازه درکوي چې په لاسي ډول یې هم رن کړئ
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm install

      # ۱. د اپلیکیشن نوم او پکیج آئي ډي (Package Name) تنظیمول
      - name: Set App Name and Package ID
        run: |
          # دلته تاسو خپل د اپلیکیشن نوم او پکیج ایډي بدلولی شئ
          jq '.expo.name = "طیب الکلام" | .expo.slug = "tayyab-al-kalam" | .expo.android.package = "com.elyas.ktayyeb"' app.json > temp.json && mv temp.json app.json
          
          echo "✅ App Name and Package ID set successfully!"

      # ۲. د عصري انډرایډ اجازو (Permissions) اضافه کول
      - name: Inject Modern Android Permissions
        run: |
          jq '.expo.android.permissions = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.READ_MEDIA_IMAGES",
            "android.permission.READ_MEDIA_VIDEO",
            "android.permission.READ_MEDIA_AUDIO",
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.VIBRATE",
            "android.permission.RECEIVE_BOOT_COMPLETED",
            "android.permission.WAKE_LOCK",
            "android.permission.SCHEDULE_EXACT_ALARM"
          ]' app.json > temp.json && mv temp.json app.json
          
          echo "✅ All modern permissions injected successfully!"

      # ۳. د Expo Prebuild کمانډ رن کول (د انډرایډ اصلي فایلونو جوړول)
      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      # ۴. د HTTP لینکونو لپاره د ClearTextTraffic اجازه
      - name: Allow HTTP / ClearText Traffic
        run: |
          cd android/app/src/main
          sed -i 's/<application/<application android:usesCleartextTraffic="true" /g' AndroidManifest.xml

      # ۵. د APK جوړول
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ۶. د جوړ شوي APK اپلوډ کول
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Al-Kalam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
