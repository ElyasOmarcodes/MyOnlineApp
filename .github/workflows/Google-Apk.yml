name: Build Tauri Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۱. د Node.js اضافه کول د ویب برخې لپاره
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ۲. د Rust نصبول (د ټاوري د اصلي کوډونو لپاره)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # د انډرایډ د مختلفو پروسیسرونو لپاره ټارګټونه
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      # ۳. جاوا ۱۷ (ټاوري له ۱۷ سره تر ټولو ښه کار کوي)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # ۴. د انډرایډ SDK او NDK نصبول
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ۵. د پروژې کتابتونونه نصبول
      - name: Install dependencies
        run: npm install

      # ۶. د ټاوري انډرایډ بلډ (APK جوړول)
      - name: Build Tauri Android App
        run: npx tauri android build

      # ۷. د جوړ شوي APK اپلوډ کول
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Al-Kalam-Tauri-APK
          # دا د ټاوري د ډیفالټ انډرایډ بلډ لار ده
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
